# SPDX-License-Identifier: Apache-2.0

name: test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: msrv-1.88
      - name: Type-check at declared MSRV
        run: cargo check --workspace --locked
      # `cargo check` cannot catch optimizer/linker regressions. This exact
      # release-profile link is the repository's executable MSRV contract: its
      # minimum compiler must produce the optimized artifact our release
      # controller and agent-eval harness exercise.
      - name: Build and run release profile at declared MSRV
        run: |
          cargo build --workspace --release --locked
          ./target/release/dbmd --version
      - name: Lint every target from a fresh graph at declared MSRV
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/dbmd-clippy-msrv" \
            cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Installer trust-boundary tests
        run: sh scripts/test-install-security.sh
      - name: Release trust-boundary tests
        run: sh scripts/test-release-security.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/dbmd-clippy-stable" \
            cargo clippy --workspace --all-targets --locked -- -D warnings
