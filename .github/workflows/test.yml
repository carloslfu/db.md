# SPDX-License-Identifier: Apache-2.0

name: test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: msrv-1.88
      - name: Type-check at declared MSRV
        run: cargo check --workspace --locked
      # `cargo check` cannot catch optimizer/linker regressions. This exact
      # release-profile link is the repository's executable MSRV contract: its
      # minimum compiler must produce the optimized artifact our release
      # controller and agent-eval harness exercise.
      - name: Build and run release profile at declared MSRV
        run: |
          cargo build --workspace --release --locked
          ./target/release/dbmd --version
      - name: Lint every target from a fresh graph at declared MSRV
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/dbmd-clippy-msrv" \
            cargo clippy --workspace --all-targets --locked -- -D warnings

  release-targets:
    name: release target (${{ matrix.rust_target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: release-${{ matrix.rust_target }}
      - name: Install cross
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cross@0.2.5
      - name: Verify immutable cross image pin
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.rust_target }}" in
            aarch64-unknown-linux-musl)
              expected='ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4'
              ;;
            x86_64-unknown-linux-musl)
              expected='ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99'
              ;;
            *) exit 1 ;;
          esac
          grep -A1 -F "[target.${{ matrix.rust_target }}]" Cross.toml |
            grep -Fqx "image = \"$expected\"" || {
            echo "::error::cross image is not pinned to the reviewed OCI digest" >&2
            exit 1
          }
      - name: Build shipped release target
        run: cross build --release --locked --target ${{ matrix.rust_target }} -p dbmd-cli

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Installer trust-boundary tests
        run: sh scripts/test-install-security.sh
      - name: Release trust-boundary tests
        run: sh scripts/test-release-security.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/dbmd-clippy-stable" \
            cargo clippy --workspace --all-targets --locked -- -D warnings
