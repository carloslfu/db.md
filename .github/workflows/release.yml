# SPDX-License-Identifier: Apache-2.0
#
# Cross-compile + release pipeline for the single `dbmd` binary
# (plan: db-md-rust-toolkit.md, Block 8).
#
# Four targets, built on native Darwin runners or in digest-pinned `cross`
# containers for Linux:
#
#   darwin-x86_64        x86_64-apple-darwin          macos-13   (Intel runner, native)
#   darwin-aarch64       aarch64-apple-darwin         macos-14   (Apple Silicon, native)
#   linux-x86_64-musl    x86_64-unknown-linux-musl    ubuntu     (cross / Docker)
#   linux-aarch64-musl   aarch64-unknown-linux-musl   ubuntu     (cross / Docker)
#
# Per-target output is a tarball `dbmd-<version>-<target>.tar.gz` containing
# the `dbmd` binary + NOTICE + THIRD_PARTY_NOTICES + LICENSE. A single
# `SHA256SUMS` manifest covers every tarball (standard `sha256sum -c` format).
#
# CI first builds four retained workflow artifacts. The job that creates the
# draft release is held behind the protected `release-publishing` environment
# until the local release controller independently rebuilds and byte-compares
# all four targets. After approval CI stages and attests the draft, publishes
# crates.io, then publishes the immutable, non-latest GitHub release. The
# controller verifies both channels, updates Homebrew through the optimistic
# GitHub Contents API, and sets `latest` only after full convergence.
#
# IMPORTANT (CI-gated, cannot run on a single dev host): cross-platform
# execution is exercised only by CI runners. The macOS/musl/aarch64 builds and
# their smoke tests run in GitHub Actions; they are authored + self-linted
# here, not executed locally. See `smoke.yml` for the post-publish smoke job.

name: release

on:
  push:
    tags:
      # Cut a release by pushing a SemVer tag, e.g. `v0.2.0`.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), e.g. 0.2.0. Defaults to the workspace version.'
        required: false
        type: string

permissions:
  contents: read  # least privilege by default; jobs elevate locally as needed

env:
  CARGO_TERM_COLOR: always
  BINARY: dbmd

jobs:
  # ── Resolve the version once, so every job agrees on it ──────────────────
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            ver="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # Strip a leading `v` from the tag (vX.Y.Z -> X.Y.Z).
            ver="${GITHUB_REF_NAME#v}"
          else
            # Fall back to the workspace [workspace.package] version.
            ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          # Sanity-check it looks like SemVer.
          echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$' || {
            echo "::error::resolved version '$ver' is not SemVer" >&2; exit 1; }
          # If a tag triggered this, it must match the workspace version
          # (release tag and Cargo.toml must never disagree).
          if [ "${{ github.ref_type }}" = "tag" ]; then
            cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            if [ "$ver" != "$cargo_ver" ]; then
              echo "::error::tag version '$ver' != Cargo.toml version '$cargo_ver'" >&2
              exit 1
            fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $ver"

  # ── Build one tarball per target ────────────────────────────────────────
  preflight:
    needs: version
    name: release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # The release tag must be proven to descend from the protected main
          # branch. A shallow tag checkout cannot establish that ancestry.
          fetch-depth: 0

      - name: Require the release tag to be on protected main
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$tagged" = "$GITHUB_SHA" || {
            echo "::error::trigger SHA $GITHUB_SHA is not the commit named by $GITHUB_REF" >&2
            exit 1
          }
          git merge-base --is-ancestor "$tagged" origin/main || {
            echo "::error::release tag $GITHUB_REF_NAME is not reachable from protected main" >&2
            exit 1
          }
          echo "release source: $GITHUB_REF_NAME -> $tagged (ancestor of origin/main)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: |
          CARGO_TARGET_DIR="${RUNNER_TEMP}/dbmd-clippy-release" \
            cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Publishability
        run: |
          make sync
          scripts/check-publishability.sh

      - name: cargo-deny (advisories + licenses + bans)
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902
        with:
          command: check advisories licenses bans

  build:
    needs: [version, preflight]
    name: build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: darwin-x86_64
            rust_target: x86_64-apple-darwin
            os: macos-26
            use_cross: false
          - target_name: darwin-aarch64
            rust_target: aarch64-apple-darwin
            os: macos-26
            use_cross: false
          - target_name: linux-x86_64-musl
            rust_target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
          - target_name: linux-aarch64-musl
            rust_target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify pinned Darwin toolchain
        if: ${{ !matrix.use_cross }}
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: sh scripts/verify-darwin-toolchain.sh "$DEVELOPER_DIR"

      - name: Diagnose rejected Darwin toolchain
        if: ${{ failure() && !matrix.use_cross }}
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: sh scripts/diagnose-darwin-toolchain.sh "$DEVELOPER_DIR"

      # cross (Docker-based) handles both musl targets in reviewed immutable
      # images, avoiding mutable apt repositories and host sysroots.
      - name: Install cross (linux)
        if: matrix.use_cross
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cross@0.2.5

      - name: Verify immutable cross image pin (linux)
        if: matrix.use_cross
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.rust_target }}" in
            aarch64-unknown-linux-musl)
              expected='ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4'
              ;;
            x86_64-unknown-linux-musl)
              expected='ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99'
              ;;
            *) exit 1 ;;
          esac
          grep -A1 -F "[target.${{ matrix.rust_target }}]" Cross.toml |
            grep -Fqx "image = \"$expected\"" || {
            echo "::error::cross image is not pinned to the reviewed OCI digest" >&2
            exit 1
          }

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euo pipefail
          RUSTFLAGS="-C link-arg=-Wl,-no_uuid --remap-path-prefix=${GITHUB_WORKSPACE}=/dbmd-source --remap-path-prefix=${HOME}/.cargo=/dbmd-cargo"
          export RUSTFLAGS
          cargo build --release --locked --target ${{ matrix.rust_target }} -p dbmd-cli

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.rust_target }} -p dbmd-cli

      - name: Normalize Darwin build metadata for reproducibility
        if: startsWith(matrix.target_name, 'darwin-')
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/${BINARY}"
          xcrun vtool -set-build-version macos 11.0 11.0 \
            -replace -output "${binary}.normalized" "$binary"
          mv "${binary}.normalized" "$binary"
          chmod +x "$binary"
          if LC_ALL=C grep -aFq "$GITHUB_WORKSPACE" "$binary" ||
            LC_ALL=C grep -aFq "$HOME/.cargo" "$binary"; then
            echo "::error::Darwin binary retained a builder-specific source path" >&2
            exit 1
          fi

      # Assemble the per-target tarball: binary + the three legal files.
      # Tarball name: dbmd-<version>-<target>.tar.gz
      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target_name }}"
          stage="dbmd-${version}-${target}"
          bin_path="target/${{ matrix.rust_target }}/release/${BINARY}"

          test -f "$bin_path" || { echo "::error::binary not found at $bin_path" >&2; exit 1; }

          mkdir -p "dist/$stage"
          cp "$bin_path"            "dist/$stage/${BINARY}"
          cp NOTICE                 "dist/$stage/NOTICE"
          cp THIRD_PARTY_NOTICES    "dist/$stage/THIRD_PARTY_NOTICES"
          cp LICENSE                "dist/$stage/LICENSE"
          chmod +x "dist/$stage/${BINARY}"

          # Build the tarball. Prefer a GNU tar (gtar on macOS, or tar when it
          # is GNU) so we can emit a deterministic, reproducible archive
          # (sorted entries, fixed mtime/owner). macOS ships BSD tar, which
          # rejects --sort/--mtime/--owner, so we fall back to a plain portable
          # tar there. Either way the contents are identical.
          tarcmd=tar
          if command -v gtar >/dev/null 2>&1; then
            tarcmd=gtar
          fi
          if "$tarcmd" --version 2>/dev/null | grep -qi 'GNU tar'; then
            "$tarcmd" \
              --sort=name \
              --mtime='2026-01-01 00:00:00 UTC' \
              --owner=0 --group=0 --numeric-owner \
              -czf "dist/${stage}.tar.gz" \
              -C dist "$stage"
          else
            # BSD tar (macOS) — portable, non-reproducible-but-correct.
            tar -czf "dist/${stage}.tar.gz" -C dist "$stage"
          fi

          # Per-tarball checksum line (merged into one manifest in `publish`).
          # shasum ships on both macOS and the Linux runners (Perl preinstalled).
          ( cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          echo "Built dist/${stage}.tar.gz"
          cat "dist/${stage}.tar.gz.sha256"

      # Quick sanity: the freshly-built binary at least answers --version with
      # the version we think we built (only for host-runnable targets — the
      # cross aarch64-musl binary can't execute on the x86_64 runner).
      - name: Verify --version (host-runnable targets)
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          stage="dbmd-${version}-${{ matrix.target_name }}"
          out="$("dist/$stage/$BINARY" --version)"
          echo "$out"
          echo "$out" | grep -q "dbmd ${version}" || {
            echo "::error::--version output '$out' does not contain 'dbmd ${version}'" >&2
            exit 1
          }

      - name: Upload target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tarball-${{ matrix.target_name }}
          path: |
            dist/dbmd-*-${{ matrix.target_name }}.tar.gz
            dist/dbmd-*-${{ matrix.target_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # ── Collect tarballs, build the manifest, create the GitHub Release ─────
  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    if: ${{ github.ref_type == 'tag' }}
    environment: release-publishing
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    permissions:
      contents: write       # create the GitHub Release + upload assets
      id-token: write        # OIDC, for the build-provenance attestation
      attestations: write    # write the provenance attestation
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download all target artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: tarball-*
          path: incoming
          merge-multiple: true

      - name: Build release tree + SHA256 manifest
        id: tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          rel="release/${version}"
          mkdir -p "$rel"

          # Gather every tarball (one per target). Expect exactly 4.
          shopt -s nullglob
          tarballs=(incoming/dbmd-*.tar.gz)
          count="${#tarballs[@]}"
          echo "Found $count tarball(s)."
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 tarballs, found $count" >&2
            printf '  %s\n' "${tarballs[@]}" >&2
            exit 1
          fi
          cp "${tarballs[@]}" "$rel/"

          # One manifest covering all tarballs, standard `sha256sum -c` format
          # (relative names, so it verifies from inside the release dir).
          ( cd "$rel" && shasum -a 256 dbmd-*.tar.gz > SHA256SUMS )
          echo "----- SHA256SUMS -----"
          cat "$rel/SHA256SUMS"

          # Self-check: the manifest verifies against the files we just wrote.
          ( cd "$rel" && shasum -a 256 -c SHA256SUMS )

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$rel" >> "$GITHUB_OUTPUT"

      # Immutable Releases lock assets when a release becomes public. Keep the
      # release draft-only while assets and attestations are assembled, then
      # publish exactly once after every preceding gate succeeds.
      - name: Create draft GitHub Release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          find_release() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${tag}\") | [.id, .draft] | @tsv"
          }

          record="$(find_release)"
          if [ -z "$record" ]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "dbmd $tag" \
              --generate-notes
            for _ in $(seq 1 30); do
              record="$(find_release)"
              [ -n "$record" ] && break
              sleep 1
            done
          fi
          test -n "$record" || {
            echo "::error::draft release $tag did not become readable" >&2
            exit 1
          }
          test "$(printf '%s\n' "$record" | wc -l | tr -d ' ')" = 1 || {
            echo "::error::multiple releases claim tag $tag" >&2
            exit 1
          }
          IFS=$'\t' read -r release_id is_draft <<<"$record"
          test "$is_draft" = true || {
            echo "::error::release $tag already exists and is not a draft" >&2
            exit 1
          }
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

      - name: Upload every release asset to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/"$VERSION"/dbmd-*.tar.gz release/"$VERSION"/SHA256SUMS)
          if [ "${#assets[@]}" -ne 5 ]; then
            echo "::error::expected four tarballs and SHA256SUMS, found ${#assets[@]} assets" >&2
            exit 1
          fi
          gh release upload "v${VERSION}" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Signed SLSA provenance. Anyone can verify a downloaded tarball was
      # built by this CI from this source:
      #   gh attestation verify <tarball> --repo carloslfu/db.md
      # Sigstore's Rekor transparency log intermittently 404s on the
      # read-after-write ("error fetching tlog entry"), which once cost three
      # release attempts. Retry up to 3x; the last attempt is the hard gate, so
      # every release still ships attested.
      - name: Attest build provenance (attempt 1)
        id: attest1
        continue-on-error: true
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e
        with:
          subject-path: 'release/${{ needs.version.outputs.version }}/dbmd-*.tar.gz'
      - name: Attest build provenance (attempt 2)
        id: attest2
        if: steps.attest1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e
        with:
          subject-path: 'release/${{ needs.version.outputs.version }}/dbmd-*.tar.gz'
      - name: Attest build provenance (attempt 3, final)
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e
        with:
          subject-path: 'release/${{ needs.version.outputs.version }}/dbmd-*.tar.gz'

      - name: Verify staged draft assets and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          release_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          )"
          test "$(printf '%s' "$release_json" | jq -r .tag_name)" = "$tag" || {
            echo "::error::draft release ID is not bound to $tag" >&2
            exit 1
          }
          test "$(printf '%s' "$release_json" | jq -r .draft)" = true || {
            echo "::error::release $tag must remain a draft until crates publish" >&2
            exit 1
          }
          actual="$(
            printf '%s' "$release_json" | jq -r '.assets[].name' |
              LC_ALL=C sort
          )"
          expected="$(
            printf '%s\n' \
              SHA256SUMS \
              "dbmd-${VERSION}-darwin-aarch64.tar.gz" \
              "dbmd-${VERSION}-darwin-x86_64.tar.gz" \
              "dbmd-${VERSION}-linux-aarch64-musl.tar.gz" \
              "dbmd-${VERSION}-linux-x86_64-musl.tar.gz" |
              LC_ALL=C sort
          )"
          test "$actual" = "$expected" || {
            echo "::error::draft release has an unexpected asset set" >&2
            printf 'actual:\n%s\n' "$actual" >&2
            exit 1
          }
          (
            cd "release/${VERSION}"
            shasum -a 256 -c SHA256SUMS
            for tarball in dbmd-*.tar.gz; do
              gh attestation verify "$tarball" \
                --repo "$GITHUB_REPOSITORY" >/dev/null
            done
          )

  # ── Publish the crates to crates.io (Trusted Publishing, no stored token) ─
  publish-crates:
    name: Publish to crates.io
    needs: [version, publish]
    runs-on: ubuntu-24.04
    if: ${{ github.ref_type == 'tag' }}
    # The `crates-io` environment binds Trusted Publishing: crates.io only
    # accepts an OIDC publish from a job running in this environment. If the
    # environment has required reviewers, GitHub pauses here for approval; the
    # intended solo-maintainer setup keeps this ungated.
    environment: crates-io
    permissions:
      id-token: write   # OIDC -> short-lived crates.io token (Trusted Publishing)
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      # Trusted Publishing: exchange GitHub OIDC for a short-lived crates.io
      # token at runtime. No token is stored in the repo or in CI.
      - name: Authenticate to crates.io via OIDC (Trusted Publishing, no token)
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe
      - name: Publish exact dbmd-core then registry-verified dbmd-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/publish-crates.sh "$VERSION"

  # Publish only after both permanent crates have converged. This release is
  # intentionally not promoted to `latest`; the local controller does that only
  # after it independently verifies the four binaries and updates Homebrew.
  publish-release:
    name: Publish immutable GitHub release
    needs: [version, publish, publish-crates]
    runs-on: ubuntu-24.04
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Publish draft without latest promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          test "$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name
          )" = "$tag"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=false >/dev/null
          for _ in $(seq 1 10); do
            immutable="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .immutable
            )"
            [ "$immutable" = true ] && exit 0
            sleep 1
          done
          echo "::error::published release $tag did not become immutable" >&2
          exit 1
