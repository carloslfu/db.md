# SPDX-License-Identifier: Apache-2.0
#
# CI: publishability guard. Packages the real crate tarballs on every push and
# PR, then compiles those exact tarballs against each other, so a packaging bug
# fails HERE instead of at `cargo publish` time.
#
# Why this exists (incident 2026-05-30): `dbmd-cli` failed to publish because
# `dbmd spec` used `include_str!("../../../../SPEC.md")` — a path that escapes
# the crate root, so SPEC.md was absent from the package tarball. A second
# issue surfaced the same day: a path-only dependency
# (`dbmd-core = { path = "../dbmd-core" }`, no `version`) is rejected at publish.
#
# Neither is caught by `cargo build` / `cargo test`, because those build from
# the workspace using the PATH dependency and the on-disk root files. `cargo
# `scripts/check-publishability.sh` builds each crate from its packaged TARBALL
# and explicitly patches the extracted CLI to the extracted same-release core.
# This needs no unpublished crate on crates.io and works across version bumps.
name: publish-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: exact tarball publishability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Package and compile the exact same-release tarballs
        run: |
          make sync
          scripts/check-publishability.sh
